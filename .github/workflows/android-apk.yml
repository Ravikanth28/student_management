name: Build Android APK

# Builds a SIGNED RELEASE Android APK via Capacitor and publishes it to
# the fixed "apk-latest" GitHub Release.
#
# One-time setup:
#   1. Run the "Generate Release Keystore" workflow (Actions → Generate Release Keystore → Run workflow).
#   2. Copy the KEYSTORE_BASE64 output from that job's logs.
#   3. Repo → Settings → Secrets → Actions → add:
#        KEYSTORE_BASE64   → (base64 string from step 2)
#        KEYSTORE_PASSWORD → StudentPortal@2024
#        KEY_ALIAS         → student-portal
#        KEY_PASSWORD      → StudentPortal@2024
#        VITE_API_BASE_URL → https://student-management-uu4p.onrender.com

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Build web app (pointed at the deployed backend)
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npm run build

      - name: Enable all required permissions in AndroidManifest
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Location permissions (required for GPS attendance)
          grep -q "ACCESS_FINE_LOCATION" "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" />\n</manifest>#' "$MANIFEST"
          # Camera permission (required for barcode scanner)
          grep -q "android.permission.CAMERA" "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$MANIFEST"
          # Notification permission (Android 13+)
          grep -q "POST_NOTIFICATIONS" "$MANIFEST" || \
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$MANIFEST"
          echo "✅ Permissions injected into AndroidManifest.xml"
          cat "$MANIFEST"

      - name: Stamp APK version from package.json
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          echo "APK versionName set to $APP_VERSION"

      - name: Configure release signing in build.gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Keystore secret found — configuring SIGNED release build."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/student-portal.keystore

            GRADLE=android/app/build.gradle

            # Step 1: Insert signingConfigs block INSIDE android { }, right after the opening brace
            # We use awk to find "android {" and insert signingConfigs after it
            awk -v ksp="$KEYSTORE_PASSWORD" -v ka="$KEY_ALIAS" -v kp="$KEY_PASSWORD" '
              /^android \{/ {
                print $0
                print "    signingConfigs {"
                print "        release {"
                print "            storeFile file(\"student-portal.keystore\")"
                print "            storePassword \"" ksp "\""
                print "            keyAlias \"" ka "\""
                print "            keyPassword \"" kp "\""
                print "        }"
                print "    }"
                next
              }
              /minifyEnabled false/ && !signed {
                print "            signingConfig signingConfigs.release"
                signed=1
              }
              { print }
            ' "$GRADLE" > "${GRADLE}.new" && mv "${GRADLE}.new" "$GRADLE"

            echo "Signing configured. build.gradle:"
            cat "$GRADLE"
          else
            echo "No KEYSTORE_BASE64 secret — building unsigned debug APK."
          fi

      - name: Sync web assets into Android project
        env:
          CAP_SERVER_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: npx --no-install cap sync android

      - name: Build APK
        working-directory: frontend/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building SIGNED release APK..."
            ./gradlew assembleRelease --no-daemon
          else
            echo "Building debug APK (no keystore configured)..."
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Locate and rename APK
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk student-portal.apk
            echo "✅ Signed release APK ready."
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk student-portal.apk
            echo "⚠️ Debug APK used (no signing secrets configured)."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-portal-apk
          path: frontend/student-portal.apk

      - name: Publish APK to release (apk-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Student Portal — Android APK (latest)
          body: |
            Latest Android build of the Student Management Portal.
            Download `student-portal.apk` below and install it on your phone.
          files: frontend/student-portal.apk

