name: Generate Release Keystore (Run Once)

# Run this ONCE to generate your signing keystore.
# After running:
#   1. Open the job logs → copy the base64 block printed under "KEYSTORE_BASE64"
#   2. Go to: Repo → Settings → Secrets and variables → Actions
#   3. Add these secrets:
#        KEYSTORE_BASE64   → (the base64 string from the logs)
#        KEYSTORE_PASSWORD → StudentPortal@2024
#        KEY_ALIAS         → student-portal
#        KEY_PASSWORD      → StudentPortal@2024
#   4. NEVER run this workflow again — running it again creates a NEW keystore
#      which would make Android treat the app as a different app (users must reinstall).

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore student-portal.keystore \
            -alias student-portal \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "StudentPortal@2024" \
            -keypass  "StudentPortal@2024" \
            -dname "CN=Student Portal, OU=Dev, O=College, L=City, S=State, C=IN"

      - name: Print base64-encoded keystore
        run: |
          echo ""
          echo "=========================================================="
          echo "  Copy everything between the dashes as KEYSTORE_BASE64"
          echo "=========================================================="
          echo "--- BEGIN KEYSTORE_BASE64 ---"
          base64 -w 0 student-portal.keystore
          echo ""
          echo "--- END KEYSTORE_BASE64 ---"
          echo ""
          echo "Add these 4 secrets to GitHub:"
          echo "  KEYSTORE_BASE64   = (the long base64 string above)"
          echo "  KEYSTORE_PASSWORD = StudentPortal@2024"
          echo "  KEY_ALIAS         = student-portal"
          echo "  KEY_PASSWORD      = StudentPortal@2024"
